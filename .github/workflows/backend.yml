name: backend

# All checks run on every PR and on main. Only main pushes the image and deploys to dev:
#   test (Dockerfile, lint, pytest + coverage); the secret scan is repo-wide: repo-checks.yml
#   → image (build arm64, Trivy, container smoke test with Kubernetes-like security flags, push to ECR)
#   → deploy-dev (reusable: commit the new tag to the gitops repo; Argo CD syncs, then the PostSync smoke Job runs)
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/workflows/_deploy-dev.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/workflows/_deploy-dev.yml"]
  workflow_dispatch: # rebuild/redeploy the current main

permissions:
  contents: read # default for every job; jobs that talk to AWS add id-token

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: myeks/backend
  # Tool images pinned by version AND digest (multi-arch indexes: they run on the arm64 runner too).
  # A re-pushed or hijacked tag cannot swap in a different tool.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  POSTGRES_IMAGE: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # Throwaway Postgres next to the runner, same major version as dev (postgres-dev) and RDS.
    # Published on 5433 so the defaults in tests/conftest.py work unchanged.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < Dockerfile

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # same minor version as the python:3.12-slim image
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Cheapest checks first: a lint or formatting problem fails in seconds
      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Check formatting (ruff format)
        run: ruff format --check --diff .

      # Against a real Postgres (no mocks): SQL typos and constraint errors only show up there.
      # Coverage gate: untested code fails the build (93% on 2026-10-24; gate 90 leaves headroom).
      - name: Run tests (with coverage gate)
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  image:
    needs: test # a red test means nothing is built, pushed or deployed
    # Native arm64 runner = same CPU architecture as our Graviton nodes, no QEMU emulation
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # OIDC token → AWS role (main only: the role trusts refs/heads/main)
    # Only the tag crosses jobs: GitHub drops outputs containing a masked value (the account ID)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Image tag = short commit SHA (immutable in ECR)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (linux/arm64)
        run: docker build --provenance=false -t "backend:${{ steps.meta.outputs.tag }}" .

      # Fails only on HIGH/CRITICAL findings that HAVE a fix (unfixed OS CVEs have nothing to upgrade to)
      - name: Scan the image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "backend:${{ steps.meta.outputs.tag }}"

      # Run the built image the way the cluster will: non-root uid, read-only root filesystem
      # with only /tmp writable, no capabilities, no privilege escalation. An image that breaks
      # under these rules fails here, not as a CrashLoopBackOff in the cluster.
      - name: Container smoke test (Kubernetes-like security flags)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_DB=app -e POSTGRES_USER=app -e POSTGRES_PASSWORD=smoke "$POSTGRES_IMAGE"
          docker run -d --name backend --network smoke -p 8000:8000 \
            --read-only --tmpfs /tmp --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DB_HOST=db -e DB_PORT=5432 -e POSTGRES_DB=app -e POSTGRES_USER=app -e POSTGRES_PASSWORD=smoke \
            "backend:$TAG"
          # Same budget as the startupProbe: init_db() waits up to ~60 s for the database
          for i in $(seq 1 45); do
            curl -fsS http://localhost:8000/api/ready > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/ready
          curl -fsS http://localhost:8000/api/health | grep -q '"database":"connected"'
          echo "smoke test passed"

      - name: Logs of the smoke-test containers
        if: failure()
        run: docker logs backend; docker logs db

      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APP_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-app-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Push stays simple: the image that passed every check above is retagged, never rebuilt.
      # Immutable tags: a re-run of the same commit reuses the image already in ECR.
      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY"
          TAG="${{ steps.meta.outputs.tag }}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "$ECR_REPOSITORY:$TAG already in ECR, not pushing again"
          else
            docker tag "backend:$TAG" "$REPO:$TAG"
            docker push "$REPO:$TAG"
          fi

  deploy-dev:
    needs: image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-dev.yml
    with:
      app: backend
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
